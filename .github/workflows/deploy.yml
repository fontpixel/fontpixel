name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # Releases 上传
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 安装系统依赖(bdftopcf)
        run: sudo apt-get update && sudo apt-get install -y xfonts-utils

      - name: 安装 Python 依赖
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "pipeline[dev]"

      - name: 恢复构建缓存
        uses: actions/cache@v4
        with:
          path: .cache
          key: fbf-cache-${{ hashFiles('fonts/**', 'pipeline/fbf/**') }}
          restore-keys: fbf-cache-

      - name: 构建字体数据(体积红线 900MB)
        run: .venv/bin/python -m fbf.build --fonts fonts --out site/public/data --downloads dist-downloads --cache .cache --budget-mb 900

      - name: Astro 构建
        run: |
          rm -rf site/public/downloads   # 下载物只走 Releases,绝不进 Pages
          cd site && npm ci && npx astro build
        env:
          FBF_DOWNLOADS_BASE: https://github.com/${{ github.repository }}/releases/download/downloads

      - name: 上传 Pages 构建物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: 同步下载物到 Releases(增量)
        run: .venv/bin/python .github/scripts/sync_release.py --dir dist-downloads --tag downloads
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
