name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.2-${{ hashFiles('site/bun.lock') }}

      - name: 安装系统依赖(bdftopcf)
        run: sudo apt-get update && sudo apt-get install -y xfonts-utils

      - name: 安装 Python 依赖
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e "pipeline[dev]"

      - name: pytest
        run: .venv/bin/python -m pytest pipeline/tests -q

      - name: 恢复构建缓存
        uses: actions/cache@v4
        with:
          path: .cache
          key: opf-cache-${{ hashFiles('fonts/**', 'pipeline/opf/**') }}
          restore-keys: opf-cache-

      - name: 构建字体数据
        run: .venv/bin/python -m opf.build --fonts fonts --out site/public/data --downloads dist-downloads --cache .cache

      - name: 安装站点依赖
        run: cd site && bun install --frozen-lockfile

      - name: vitest
        run: cd site && bun run vitest run

      - name: 类型检查(astro check + svelte-check)
        run: cd site && bun run check

      - name: Astro 构建
        run: cd site && bun run build

      - name: Check generated SEO metadata and sitemaps
        run: cd site && bun run audit:seo

      - name: 检查完整站点的 Pages 免费额度
        run: python .github/scripts/check_pages_limits.py site/dist

      - name: 安装 Playwright Chromium
        run: cd site && bun run playwright install --with-deps chromium

      - name: e2e
        run: cd site && bun run playwright test
        env:
          CI: 'true'

      - name: Lighthouse mobile and desktop
        run: cd site && bun run audit:lighthouse

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-quality-reports
          path: |
            site/quality-reports/
            site/test-results/
          retention-days: 14
