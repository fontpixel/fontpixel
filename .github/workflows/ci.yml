name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 安装系统依赖(bdftopcf)
        run: sudo apt-get update && sudo apt-get install -y xfonts-utils

      - name: 安装 Python 依赖
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "pipeline[dev]"

      - name: pytest
        run: .venv/bin/pytest pipeline/tests -q

      - name: 恢复构建缓存
        uses: actions/cache@v4
        with:
          path: .cache
          key: opf-cache-${{ hashFiles('fonts/**', 'pipeline/opf/**') }}
          restore-keys: opf-cache-

      - name: 构建字体数据
        run: .venv/bin/python -m opf.build --fonts fonts --out site/public/data --downloads dist-downloads --cache .cache

      - name: 安装站点依赖
        run: cd site && npm ci

      - name: vitest
        run: cd site && npx vitest run

      - name: Astro 构建
        run: cd site && npx astro build

      - name: 安装 Playwright Chromium
        run: cd site && npx playwright install --with-deps chromium

      - name: e2e
        run: cd site && npx playwright test
        env:
          CI: 'true'
