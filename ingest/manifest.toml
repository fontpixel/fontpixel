# ==================== 合并片段：masaeedu/bitmap-fonts（2026-08-29）====================
# masaeedu/bitmap-fonts（clone 于 2026-08-29）导入清单片段。
# 源目录：github-clones-2026-08-29/masaeedu-bitmap-fonts/bitmap/，用户已完成自由许可核查，
# 只处理以下 23 个目录：bitocra, cherry, clearlyu, creep, ctrld-font, dina, dylex, gohufont,
# kakwa, leggie, lode, mplus, orp-font, siji, spleen, sq, tamsyn-font-1.11, tamzen-font,
# terminus-font-4.39, tewi-font, unscii, uw-ttyp0-1.2, xbmicons。其余目录（artwiz、boxxy、
# jmk-x11-fonts 等）不在核查范围内，本片段一律不碰。
#
# 家族拆分说明：
#  - bitocra/ 目录内实际含 4 款不同设计（均为 Aaron Christianson / ninjaaron 所作，同一 OFL-1.1
#    许可）：4thD、5thElement、bitbuntu、bitocra（含 7/11/13px 与 full 字符集变体），拆成 4 个家族。
#  - dylex/ 目录内含 2 款不同设计：6x10/7x13/10x20 三档尺寸是 X11 misc-fixed（"Fixed"/"terminal"）
#    的 dylex 分支，14x14 是另一款名为 "crawl" 的字体（FONT XLFD 内 FAMILY_NAME 不同），拆成
#    dylex-terminal 与 dylex-crawl 两个家族。
#  - mplus/ 按用户指定合并为单一家族 mplus-bitmap（slug 由用户指定），涵盖 fxd/hlv/qub/sys 四种
#    字重字号变体；mplus_cursors.bdf 是 X11 光标字体（FONT cursor），非文本字体，进 todo。
#  - tamzen-font/ 目录除核心 Tamzen 家族外，另含 Powerline（纯符号补充字体）与 TamzenForPowerline
#    （Tamzen 正文缝合 Powerline 符号的衍生版），均判定为非独立设计，进 todo 不收录。
#  - spleen 已收录（slug spleen，来自 fcambus 官方仓库），本片段仅记一条 todo。
#
# 许可证文件核查：23 个目录中仅 clearlyu/README 内嵌许可证全文（MIT/X11 风格），其余全部目录
# 均无独立 LICENSE/COPYING 文件；授权依据来自 BDF/PCF 头 COPYRIGHT/COMMENT/NOTICE 字段，或用户
# 对上游仓库的预先核查（各 family 块上方均有注释说明依据来源）。
#
# 共 26 个 family、4 个 todo。

