# neodgm's own repo README doesn't directly state the pixel size, but the sibling repo neodgm-pro's README
# explicitly says the base font "NeoDunggeunmo" is an 8x16 (Latin) / 16x16 (Hangul) grid, so ppem=16 is filled in
# by hand accordingly; neodgm_code.ttf is a monospace/coding variant of the same design and belongs to the same
# family as neodgm.ttf. RELEASE-ASSETS contains uncompressed release artifacts that convert_take can scan directly.
