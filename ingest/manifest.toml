source = "direct-downloads-2026-08-31/websites/Silver, a font for games by Poppy Works.html"
reason = "Silver（Poppy Works / Wolfgang Wozniak）。2026-08-31 依用户提供的 itch.io 页面快照重新复核，结论与此前 Maoken-Direct/7577 一致，条款一字未改：页面把授权写作“Free* License — Attribution 4.0 International (CC BY 4.0)”，随后以星号附加“However, if the budget of your production exceeds $100,000 USD in total spend or earnings, or if you require urgent support, please contact hello@poppy.works to license this font.”。CC BY 4.0 本身允许不限规模的商业使用且合规后不可撤回，而该星号把预算门槛写成了“Free* License”的组成部分（要求另行 license this font），二者直接冲突；使用者无从判断以哪个为准。按本站收录标准——授权须明确、无歧义地允许任何人为任何目的使用与商用，且不因使用者规模设限——不予收录。注：其中“urgent support（加急支持）”属服务收费，本身不影响授权；有问题的是预算门槛这一条。作者若明确该门槛只是自愿联系的请求而非使用条件，可重新评估。另：Silver 的致谢列出 PixelMPlus（itouhiro）与 DOSGothic（leedheo）为主要贡献者，这两款本站均已收录。"
reason_en = "Silver (Poppy Works / Wolfgang Wozniak). Re-reviewed on 2026-08-31 against the itch.io page snapshot the user supplied; the conclusion matches the earlier one for Maoken-Direct/7577 and the terms have not changed by a word. The page states the licence as \"Free* License - Attribution 4.0 International (CC BY 4.0)\" and then attaches, behind the asterisk, \"However, if the budget of your production exceeds $100,000 USD in total spend or earnings, or if you require urgent support, please contact hello@poppy.works to license this font.\" CC BY 4.0 itself permits commercial use at any scale and is irrevocable once complied with, whereas the asterisk makes the budget threshold part of the Free* License by requiring the font to be licensed separately; the two conflict directly, and a user has no way to tell which governs. Under this site's standard -- the licence must permit anyone, unambiguously, to use the font for any purpose including commercially, with no limit tied to the user's size -- it is not catalogued. Note that the urgent-support half is a charge for a service and does not affect the licence; the problem is the budget threshold. Should the author state that the threshold is a voluntary request to make contact rather than a condition of use, this can be reassessed. Also worth noting: Silver's credits list PixelMPlus (itouhiro) and DOSGothic (leedheo) as principal contributors, and both are catalogued here."

