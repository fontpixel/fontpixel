source = "pixel-fonts-supplement-zeoseven-maoken-2026-08-18/Upstream-Direct/NanoDyongChyangSong（纳米点墙宋）"
reason = "README 允许免费使用、复制、修改、分发，但另写「不可为字体收费」，与自由许可要求的商用自由相抵触；仓库无完整 LICENSE，发布包 TTF 也缺版权与许可信息，且日文、繁体、韩文字形的上游来源未完整说明，无法认定为 MIT／HPND／OFL 中任何一种。存疑，排除。注意同作者的 NanoQyoanDaSong v2.0+ 为 OFL 1.1，已收录。"

