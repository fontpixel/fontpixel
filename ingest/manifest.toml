# ==================== 合并片段：farsil/ibmfonts（2026-08-29）====================
# farsil/ibmfonts — IBM PC/XT/EGA/CGA/MDA/VGA 文本模式 ROM 字库的 BDF 复刻集合。
# 仓库 LICENSE(根目录 LICENSE 文件)明确:全部 bdf/ 下的 BDF 字体采用 CC BY-SA 4.0,
# 许可证全文见 licenses/CC-BY-SA-4.0;configure 脚本另采用 MIT 许可,与字体无关,不收录。
# 家族划分依据 README.md 的「Font Preview」章节与各 BDF 文件内 STARTPROPERTIES 的
# FOUNDRY/FAMILY_NAME 字段:同一来源机型(BIOS/CGA/CGA Light/EGA/MDA/VGA)下的不同
# 点阵尺寸(如 8x8、8x16、9x14 等)属同一字体的不同分辨率变体,合并为一个家族;
# 不同机型来源彼此是不同字体,拆成不同家族。bdf/ 目录共 19 个文件,6 个家族的
# take 列表合计恰好覆盖全部 19 个文件,无遗漏、无重复。

