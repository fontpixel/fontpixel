# ==================== Merged fragment: manifest-frag-tecate-2026-08-31.toml ====================
# Additional inclusions from Tecate/bitmap-fonts + IT-Studio-Rech/bdf-fonts after free-license review (4th batch).
# The two repos have 54 + 48 entries combined; previously only the 23 directories confirmed via the masaeedu snapshot were included;
# this fragment fills in the remaining parts confirmed as free-licensed; disqualified ones are recorded in [[todo]].
#
# artwiz-aleczapka: no COPYING in the repo snapshot; the BDF's COPYRIGHT only says
# "artwiz, fixed by aleczapka". Licensing is based on per-package license review conclusions from distros:
# Fedora's artwiz-aleczapka-*-fonts series has license field GPL-2.0-only,
# and Gentoo's media-fonts/artwiz-aleczapka-* is likewise marked GPL-2. Hence confidence=manual,
# no license file attached; the determination basis is written per-family in note.
# The 16 BDFs in the directory are 14 mutually independent designs (glisp has regular+bold, mints has mild+strong
# weight pairs), split into 14 families per "one real font, one family".

[[family]]
slug = "artwiz-anorexia"
source = "github-clones-2026-08-31/tecate-bitmap-fonts/bitmap/artwiz/bdf"
take = ["anorexia.bdf"]
name = "Artwiz Anorexia"
authors = ["Artwiz", "Alec Zapka"]
homepage = "http://artwizaleczapka.sourceforge.net/"
