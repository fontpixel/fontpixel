[[todo]]
source = "CJK-bitmap-fonts-open-source-2026-08-18/Pan-CJK/hajimehoshi--bitmapfont"
reason = "Go 语言点阵字体库（bitmapfont v4）。实际发布产物 data/*.bin 是自定义 Go 二进制格式，并非标准字体文件，也没有 font.Face 之外的静态字体导出。仓库内确有 13 个 .bdf（+1 个 .ttf）在 internal/ 下，但全部是构建用的第三方组件副本：internal/ark 的 2 个 bdf 是 ark-pixel 12px 等宽子集（已收 ark-pixel 家族覆盖）；internal/galmuri 的 GalmuriMono11.bdf 是 galmuri 的子集（已收）；internal/baekmuk（Gulim）、internal/mplus（M+ Bitmap Fonts，obsolete）、internal/fixed（misc-fixed，Public Domain 经典 X11 字体）、internal/cubic11（Cubic 11 的 ttf）均为其它字体的第三方嵌入副本，各自更适合从其官方上游仓库收录（如在本次全量清单其它分片中）。顶层 LICENSE 为 Apache-2.0（仅覆盖 Go 代码），各嵌入字体许可证见 README（Baekmuk License、M+ Bitmap Font License「free softwares」、OFL、misc-fixed 为 Public Domain）。整体建议跳过。"
reason_en = "A Go bitmap-font library (bitmapfont v4). What it actually ships, data/*.bin, is a custom Go binary format rather than a standard font file, and there is no static font export beyond font.Face. The repository does hold 13 .bdf files (plus one .ttf) under internal/, but every one is a third-party build component: the two bdfs in internal/ark are a 12px monospaced subset of ark-pixel (covered by the ark-pixel family already catalogued); internal/galmuri's GalmuriMono11.bdf is a subset of galmuri (already catalogued); and internal/baekmuk (Gulim), internal/mplus (M+ Bitmap Fonts, obsolete), internal/fixed (misc-fixed, the public-domain classic X11 font), and internal/cubic11 (a Cubic 11 ttf) are embedded copies of other fonts, each better catalogued from its own upstream repository, as some are in other fragments of this manifest. The top-level LICENSE is Apache-2.0 and covers the Go code only; the licences of the embedded fonts are listed in the README (Baekmuk License, the M+ Bitmap Font License's free-software terms, OFL, and public domain for misc-fixed). Recommend skipping the whole thing."

[[todo]]
source = "CJK-bitmap-fonts-open-source-2026-08-18/Pan-CJK/olikraus--u8g2"
reason = "u8g2 是大型渲染库，仓库内 SELECTION-NOTE.txt 已说明只保留了 CJK/Unifont/WenQuanYi/GB 相关 bdf。实测 tools/font/bdf/ 下 10 个 bdf 中：wenquanyi_*.bdf（5 个，9pt/10pt/11pt/12pt/13px）与已收 wqy-bitmapfont 重复；unifont.bdf/unifont_upper.bdf/unifont_jp.bdf（3 个）与本片段新收的 gnu-unifont 重复；gb16st.bdf/gb24st.bdf（2 个）是 1988 年 Academia Sinica（ISAS）宋体点阵字体，许可宽松（允许使用/复制/修改/分发），字形本身有历史价值，但采用 GB2312-1980 GL 编码（COMMENT 内注明「高位字节为 0」的旧式双字节编码），ENCODING 并非 Unicode 码位，当前导入器无字符集转换能力，直接收录会导致码位与实际汉字错位、不可用。建议整体跳过；gb16st/gb24st 若未来要收，需先补一个 GB2312→Unicode 转码步骤，作为独立任务处理。"
reason_en = "u8g2 is a large rendering library; the SELECTION-NOTE.txt in the repository records that only the CJK/Unifont/WenQuanYi/GB bdfs were kept. Of the 10 bdfs under tools/font/bdf/: the five wenquanyi_*.bdf (9pt, 10pt, 11pt, 12pt, 13px) duplicate the wqy-bitmapfont family already catalogued; unifont.bdf, unifont_upper.bdf, and unifont_jp.bdf duplicate the gnu-unifont family newly catalogued in this fragment; and gb16st.bdf and gb24st.bdf are the 1988 Academia Sinica (ISAS) Song bitmap fonts, permissively licensed for use, copying, modification, and distribution and of genuine historical interest, but encoded in GB2312-1980 GL -- a COMMENT notes the old-style double-byte encoding with a zero high byte -- so their ENCODING values are not Unicode code points. The importer has no charset conversion, and taking them as they are would misalign every code point against the character it should be. Recommend skipping the lot; if gb16st and gb24st are ever wanted, a GB2312-to-Unicode transcoding step has to come first, as a separate task."

