[[todo]]
source = "github-clones-2026-08-31/xorg-font-adobe-100dpi (symb*.bdf)"
reason = "Adobe Symbol 的 BDF 用 CHARSET_REGISTRY \"Adobe\" / CHARSET_ENCODING \"FontSpecific\" 分发，是 Adobe 自有的符号编码而非 Unicode；当前 decode_cp 无对应映射，收进来每个字面都是零字形。要收录须先补一张 Adobe Symbol→Unicode 映射表（希腊字母、数学运算符等，Adobe 与 Unicode 联盟均有公开的标准对照），作为独立任务处理。许可证与同目录其余 Adobe 字体相同（HPND），不是授权问题。"
reason_en = "Adobe Symbol's BDF is distributed with CHARSET_REGISTRY \"Adobe\" and CHARSET_ENCODING \"FontSpecific\" -- Adobe's own symbol encoding rather than Unicode. decode_cp has no mapping for it, so cataloguing it as it stands would give an empty glyph at every code point. Taking it would first require an Adobe Symbol to Unicode mapping table (Greek letters, mathematical operators, and so on; both Adobe and the Unicode Consortium publish standard correspondences), which is a separate task. The licence is the same HPND as the other Adobe fonts in the directory, so this is not a licensing question."

