source = "pixel-fonts-supplement-zeoseven-maoken-2026-08-18/Upstream-GitHub/Warren2060--ChillBitmap"
reason = "GitHub 仓库快照内 4 个 zip（ChillBitmap7x_v2.500.zip、Version 2.200/2.300/2.400.zip） 解压后均只含 ChillBitmap7x（7px 版）。而 7px 版基于 GuanZhi 8px 修改，猫啃网标注'作者声明'， 审计已排除（见 EXCLUDED.csv ZeoSeven 360 行）。已通过审计的 16px 版（基于 Unifont，纯 OFL+GPL，INCLUDED.csv 359 行）不在本仓库快照、也不在 Upstream-Direct 内，唯一副本是 ZeoSeven-Webfonts/359--ChillBitmap-16px 的 WOFF2 切片镜像。建议后续从该镜像还原字体，或 联系上游单独取得 16px 版本编译产物。"
reason_en = "All four zips in the GitHub repository snapshot (ChillBitmap7x_v2.500.zip and versions 2.200, 2.300, and 2.400) extract to nothing but ChillBitmap7x, the 7px cut. That cut is a modification of GuanZhi 8px, which maoken.com flags with an author's declaration and which the audit excluded (line 360 of EXCLUDED.csv, ZeoSeven). The 16px cut that passed the audit -- based on Unifont, plain OFL plus GPL, line 359 of INCLUDED.csv -- is in neither this repository snapshot nor Upstream-Direct; its only copy is the WOFF2 slice mirror at ZeoSeven-Webfonts/359--ChillBitmap-16px. Either reconstruct the font from that mirror later, or ask upstream for the 16px build output directly."

