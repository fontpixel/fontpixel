# SIL_Open_Font_License_1.1.txt of its own, which is what made this font read as OFL-1.1 here until now.
# Coverage: the repack's BestTen-CRT (v12.50) covers 8585 code points against the official build's 10196 -- a strict
# subset, identical glyph for glyph where they overlap, so the official build only adds (1611 CJK radicals and
# extension characters). Its DOT is byte-identical to the repack's.

