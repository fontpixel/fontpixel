# ==================== 合并片段:manifest-frag-tecate-2026-08-31.toml ====================
# Tecate/bitmap-fonts + IT-Studio-Rech/bdf-fonts 自由许可复核后的补收（第四批）。
# 两个仓库共 54 + 48 个条目,此前只收了 masaeedu 快照核定的 23 个目录;
# 本片段补齐其余经核实为自由许可的部分,不合格者记入 [[todo]]。
#
# artwiz-aleczapka:仓库快照内无 COPYING,BDF 的 COPYRIGHT 只写
# “artwiz, fixed by aleczapka”。授权依据为发行版的逐包许可审查结论:
# Fedora 的 artwiz-aleczapka-*-fonts 系列 license 字段为 GPL-2.0-only,
# Gentoo 的 media-fonts/artwiz-aleczapka-* 同样标 GPL-2。故 confidence=manual、
# 不附许可证文件,判定依据逐族写在 note 里。
# 目录内 16 个 BDF 是 14 套彼此独立的设计(glisp 含常规+粗体,mints 含 mild+strong
# 两档字重),按“一个真实字体一个家族”拆成 14 个家族。

