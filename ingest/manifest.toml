[[todo]]
source = "github-clones-2026-08-29/masaeedu-bitmap-fonts/bitmap/tewi-font"
reason = "Withdrawn by its own author over unclear rights. The BDF COMMENT does carry a full GPL-3.0-or-later grant from lucy, but the upstream repository (https://github.com/lucy/tewi-font, archived 2025-02-04, font files deleted, history reduced to a single commit) now carries only this notice: \"For distributors and packagers: the licensing situation for this font is somewhat unclear due to being heavily derived Monaco, so I've decided to remove it to avoid causing any problems. If you're packaging the font you probably want to do the same.\" Monaco is Apple's proprietary bitmap font, so a GPL grant over glyphs derived from it is not the author's to make, and the author says as much. This fails the collection's requirement that a licence verifiably cover the exact files catalogued, and the author has explicitly asked distributors to stop. Removed from the collection on 2026-08-31 (it had been included since 2026-08-21 on the strength of the in-file GPL text alone)."

