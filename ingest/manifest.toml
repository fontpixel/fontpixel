[[todo]]
source = "pixel-fonts-supplement-zeoseven-maoken-2026-08-18/Upstream-GitHub/Luckeee--mplus_hzk_12"
reason = "The public-domain dedication does not cover the glyphs it matters for. The repository (now https://github.com/py-zhao/mplus_hzk_12) ships an Unlicense file, but its README states the font is M+ Latin and Japanese with HZK12 supplying the Chinese, and says of HZK12 only that it is an ancient font \"reportedly without copyright\" (据说没有版权), concluding \"if HZK really has no copyright, then mplus_hzk_12 is likewise a free font\" (如果hzk 真的没有版权…). That is the author's own admission that the grant rests on an unverified assumption about someone else's work. HZK12 was distributed with commercial Chinese DOS systems and no rights holder has ever released it under a free licence; the belief that it is uncopyrighted is folklore from the BBS era. WenQuanYi built its bitmap song face from scratch rather than reuse HZK for exactly this reason. The affected glyphs are not incidental: the font covers GB/T 2312 in full (6763/6763) out of 10609 glyphs, so the whole Chinese repertoire rests on the assumption. Fails the requirement that a licence verifiably cover the exact files catalogued. Removed from the collection on 2026-09-01 (included 2026-08-21 on the strength of the bundled Unlicense alone)."

