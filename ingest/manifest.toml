# ==================== 自家製ドットフォント (JF Dot Font) — jikasei.me, catalogued 2026-09-03 ====================
# 11 families out of the 54-face jfdotfont-20150527 archive. These are 自家製フォント工房's TrueType re-issues of
# bitmap fonts other people published; the source page is explicit that it claims nothing of its own:
# 「フォントの著作権およびライセンスは、原版 (変換元) のフォントから継承します」 and 「自家製フォント工房は、これらの
# 生成物に対して、著作権を持たず、あらゆる独自の権利を行使しません」. So each family is catalogued under the ORIGINAL
# font's name and author, with the JFドット names kept only as aliases and the conversion recorded in the provenance.
#
# Every ttf embeds a 1:1 bitmap strike (EBLC/EBDT) at exactly its nominal size, so rasterizing at that size returns
# the author's own bitmap rather than an approximation -- verified by JF-Dot-Shinonome16 coming out pixel-identical to
# the shinonome-gothic-16px.bdf this site already builds from the original BDF source. detect_native_ppem cannot judge
# these (it returns None, or 64 for the 1024upem/16-unit cases), so ppem is filled in per file from the EBLC strike.
#
# Not catalogued from this archive:
#  - 東雲 x7, M+ x6, k6x8 x1: already here as shinonome-*, mplus-*, k6x8, from their own upstreams.
#    (The JF cuts do add bold weights the original 東雲 BDF release has none of -- left as a separate question.)
#  - jiskan16-1990/-2000/(2004) and jiskan24-2000/(2004): the SONY halfwidth builds. Redistribution requires attaching
#    sony.txt plus the copyright notice, and the archive's doc/ directory is empty, so that condition cannot be met.
#    Their fullwidth is identical to the builds taken below anyway; only the halfwidth differs.
#  - 恵梨沙フォント8, ぱう16, ナガ10/ナガみん10/ナガまる10: shipped as separate archives and not free -- non-commercial
#    only, or commercial use subject to a permission the page says can no longer be requested.

