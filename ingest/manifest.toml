# ==================== Merged fragment: manifest-frag-pancjk.toml ====================
# Import manifest fragment for CJK-bitmap-fonts-open-source-2026-08-18/Pan-CJK/,
# covering every repo in that directory (already-included ones skipped: quiple--galmuri, stgiga--UnifontEX;
# 44670 is out of scope for this fragment). Verified via: ls / find / unzip -l / head, confirmed repo by repo.
#
# Special notes:
# 1) ark-pixel: this fragment's [[family]] slug="ark-pixel" is the full-size version,
#    replacing the pilot single-size entry slug="ark-pixel-12px-monospaced" in
#    ingest/manifest.toml -- delete the old entry when merging.
# 2) fusion-pixel / fusion-bold-pixel: besides the root-directory OFL.txt, these two repos'
#    release zips also contain identically-named sub-licenses LICENSES/<component-font>/OFL.txt,
#    LICENSES/<component-font>/LICENSE.txt, etc. (for the embedded-credit component fonts
#    boutique-bitmap-7x7, galmuri, misaki, miseki-bitmap, etc.). Since extraction writes files by basename,
#    literal names like "OFL.txt"/"LICENSE.txt" would collide with same-named files in subdirectories
#    and overwrite each other, so these two families' zip_take only takes "*.bdf", and license_files is used instead
#    to point at the repo root's LICENSE-OFL / LICENSE-MIT (content confirmed identical to the zip's root
#    OFL.txt via a diff of the header) -- the component fonts' license copies are not included.
# 3) gnu-unifont: in the multitheftauto--unifont repo's official release, the actual
#    unifont-*.bdf only exists inside RELEASE-ASSETS/src_unifont-16.0.04.tar.gz
#    (and is double-compressed as .bdf.gz). The existing importer's extract_zip only supports .zip,
#    and take does no decompression at all, so this bdf can't be taken directly. RELEASE-ASSETS also has
#    directly usable unifont-16.0.04.otf / unifont_jp-16.0.04.otf (not a zip, not a tar,
#    a vector OTF directly). Locally testing with opf.ingest.rasterize.detect_native_ppem
#    confirmed both are detected as a native 16 grid, so the convert="ttf" rasterization route is used instead,
#    to fulfill the briefing's intent of "include it if there's a unifont-*.bdf" (an equivalent substitute path).

[[family]]
slug = "ark-pixel"
source_kind = "bitmap"
source_formats = ["BDF"]
source = "github-releases-2026-09-01/TakWolf--ark-pixel-font"
zips = [
    "RELEASE-ASSETS/ark-pixel-font-10px-monospaced-bdf-v2026.09.01.zip",
    "RELEASE-ASSETS/ark-pixel-font-10px-proportional-bdf-v2026.09.01.zip",
    "RELEASE-ASSETS/ark-pixel-font-12px-monospaced-bdf-v2026.09.01.zip",
    "RELEASE-ASSETS/ark-pixel-font-12px-proportional-bdf-v2026.09.01.zip",
    "RELEASE-ASSETS/ark-pixel-font-16px-monospaced-bdf-v2026.09.01.zip",
    "RELEASE-ASSETS/ark-pixel-font-16px-proportional-bdf-v2026.09.01.zip",
]
zip_take = ["*.bdf", "OFL.txt"]
name = "Ark Pixel"
name_zh = "方舟像素"
author = "TakWolf"
homepage = "https://ark-pixel-font.takwolf.com"
repository = "https://github.com/TakWolf/ark-pixel-font"
provenance_url = "https://github.com/TakWolf/ark-pixel-font/releases (v2026.09.01)"
