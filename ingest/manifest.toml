[[family]]
slug = "gnu-unifont"
source = "CJK-bitmap-fonts-open-source-2026-08-18/Pan-CJK/multitheftauto--unifont"
# 见文件头说明 3)：官方 bdf 仅存在于 tar.gz 内部（双重压缩，当前导入器不支持），
# 改用 RELEASE-ASSETS 下直接可得的矢量 OTF 栅格化回点阵；两个文件均实测原生
# 16 格点（detect_native_ppem 验证一致），故显式填写 ppem。
convert = "ttf"
convert_take = ["unifont-16.0.04.otf", "unifont_jp-16.0.04.otf"]
ppem = 16
license_files = ["LICENSE.txt", "OFL-1.1.txt"]  # 自 13.0.04 起双授权：GNU GPL 2+（含字体嵌入例外）与 OFL-1.1
name = "GNU Unifont"
name_zh = ""
author = "GNU Unifont Project"
homepage = "http://unifoundry.com/unifont/index.html"
repository = "https://github.com/multitheftauto/unifont"
provenance_url = "https://github.com/multitheftauto/unifont/releases (v16.0.04)"
form = "other"
vibes = ["fallback"]

# --- TakWolf--retro-pixel-font：11 个 zip 均为同一次发布的格式变体（bdf/dfont/
# ms.bitmap.ttf/otb/otf/otf.woff/otf.woff2/pcf/ttf/ttf.woff/ttf.woff2），
# 并非"每 zip 一风格"；真正的风格拆分在 bdf zip 内部的子目录（arcade/
# cute-mono/cute-prop/petty-5h/petty-5x5/thick）。经查各 bdf 内 XLFD FONT
# 名与 SPACING 字段：Cute Mono/Cute Prop 为同一字体"Cute"的等宽/比例两种
# 模式（合并为一个家族）；Petty 5H 与 Petty 5x5 是两个不同署名的独立设计
# （均 5px，但 FONT 名不同、非 Mono/Prop 命名），故拆成 5 个家族。全部风格
# 均为拉丁/符号字体（无 CJK 字形），form 采用西文分类。

