[[family]]
slug = "gnu-unifont"
source = "CJK-bitmap-fonts-open-source-2026-08-18/Pan-CJK/multitheftauto--unifont"
# 见文件头说明 3)：官方 bdf 仅存在于 tar.gz 内部（双重压缩，当前导入器不支持），
# 改用 RELEASE-ASSETS 下直接可得的矢量 OTF 栅格化回点阵；两个文件均实测原生
# 16 格点（detect_native_ppem 验证一致），故显式填写 ppem。
