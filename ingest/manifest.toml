[[family]]
slug = "gnu-unifont"
source = "CJK-bitmap-fonts-open-source-2026-08-18/Pan-CJK/multitheftauto--unifont"
# See note 3) at the top of the file: the official bdf only exists inside a tar.gz (double-compressed, not supported by the current importer),
# so the directly available vector OTF under RELEASE-ASSETS is rasterized back into a bitmap instead; both files were tested and confirmed
# to be a native 16 grid (confirmed consistent by detect_native_ppem), so ppem is filled in explicitly.
convert = "ttf"
convert_take = ["unifont-16.0.04.otf", "unifont_jp-16.0.04.otf"]
ppem = 16
license_files = ["LICENSE.txt", "OFL-1.1.txt"]  # 自 13.0.04 起双授权：GNU GPL 2+（含字体嵌入例外）与 OFL-1.1
name = "GNU Unifont"
name_zh = ""
author = "GNU Unifont Project"
homepage = "http://unifoundry.com/unifont/index.html"
repository = "https://github.com/multitheftauto/unifont"
provenance_url = "https://github.com/multitheftauto/unifont/releases (v16.0.04)"
form = "other"
vibes = ["fallback"]

