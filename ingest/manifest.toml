# ==================== 合并片段：farsil/ibmfonts（2026-08-29）====================
# farsil/ibmfonts — IBM PC/XT/EGA/CGA/MDA/VGA 文本模式 ROM 字库的 BDF 复刻集合。
# 仓库 LICENSE(根目录 LICENSE 文件)明确:全部 bdf/ 下的 BDF 字体采用 CC BY-SA 4.0,
# 许可证全文见 licenses/CC-BY-SA-4.0;configure 脚本另采用 MIT 许可,与字体无关,不收录。
# 家族划分依据 README.md 的「Font Preview」章节与各 BDF 文件内 STARTPROPERTIES 的
# FOUNDRY/FAMILY_NAME 字段:同一来源机型(BIOS/CGA/CGA Light/EGA/MDA/VGA)下的不同
# 点阵尺寸(如 8x8、8x16、9x14 等)属同一字体的不同分辨率变体,合并为一个家族;
# 不同机型来源彼此是不同字体,拆成不同家族。bdf/ 目录共 19 个文件,6 个家族的
# take 列表合计恰好覆盖全部 19 个文件,无遗漏、无重复。

[[family]]
slug = "ibm-bios"
source = "github-clones-2026-08-29/farsil-ibmfonts"
take = ["ib8x8u.bdf", "ib16x8u.bdf", "ib8x16u.bdf", "ib16x16u.bdf"]
license_files = ["CC-BY-SA-4.0"]
name = "IBM BIOS"
name_zh = ""
author = "VileR（The Ultimate Oldschool PC Font Pack，像素复原）；farsil / Marco Buzzanca（BDF 转换与整理，2016）"
homepage = "https://farsil.github.io/ibmfonts/"
repository = "https://github.com/farsil/ibmfonts"
provenance_url = "https://github.com/farsil/ibmfonts (clone 于 2026-08-29)"
form = "terminal"
vibes = ["retro-game", "terminal-hardcore"]

[family.license]
spdx = "CC-BY-SA-4.0"
name = "Creative Commons 署名-相同方式共享 4.0 国际"
file = "CC-BY-SA-4.0"
commercial = true
note = "仓库 LICENSE 声明全部 BDF 字体采用 CC BY-SA 4.0；本家族复刻自 IBM PC/XT 主板 BIOS ROM 内置的文本模式字库（并非独立显卡字库，是显卡尚未接管前的系统级后备字体），由 VileR 在《The Ultimate Oldschool PC Font Pack》中完成像素级复原，farsil（Marco Buzzanca）于 2016 年转换为 BDF 格式并整理发布（各 BDF 文件内 COPYRIGHT 字段注明：“BDF conversion (c) 2016 farsil, license: CC BY-SA 4.0”）。再分发须保留署名与许可链接，衍生版须继续采用兼容的共享协议。"

