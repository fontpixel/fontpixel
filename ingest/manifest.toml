# --- TakWolf--retro-pixel-font: all 11 zips are format variants of the same release (bdf/dfont/
# ms.bitmap.ttf/otb/otf/otf.woff/otf.woff2/pcf/ttf/ttf.woff/ttf.woff2),
# not "one style per zip"; the actual style split is in subdirectories inside the bdf zip (arcade/
# cute-mono/cute-prop/petty-5h/petty-5x5/thick). Checking the XLFD FONT
# name and SPACING field in each bdf: Cute Mono/Cute Prop are the monospace/proportional
# modes of the same font "Cute" (merged into one family); Petty 5H and Petty 5x5 are two independently
# authored, independent designs (both 5px, but with different FONT names, not Mono/Prop naming), so they're split into 5 families. All styles
# are Latin/symbol fonts (no CJK glyphs), so form uses Western classification.

