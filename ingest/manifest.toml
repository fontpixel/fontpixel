note = "仓库 LICENSE 声明全部 BDF 字体采用 CC BY-SA 4.0；本家族复刻自 IBM PC/XT 主板 BIOS ROM 内置的文本模式字库（并非独立显卡字库，是显卡尚未接管前的系统级后备字体），由 VileR 在《The Ultimate Oldschool PC Font Pack》中完成像素级复原，farsil（Marco Buzzanca）于 2016 年转换为 BDF 格式并整理发布（各 BDF 文件内 COPYRIGHT 字段注明：“BDF conversion (c) 2016 farsil, license: CC BY-SA 4.0”）。再分发须保留署名与许可链接，衍生版须继续采用兼容的共享协议。"

