# ============ Google-Fonts ============
# 两目录均为 ZeoSeven FontsAPI 式的 CSS + WOFF2 Unicode-range 切片导出（result.css +
# font-NN.woff2），并非官方 google/fonts 仓库的完整 ttf；已核对每个切片的 Unicode 覆盖，
# 选取含基本拉丁字母(U+0000-00FF)的切片。

[[family]]
slug = "press-start-2p"
source = "pixel-fonts-supplement-zeoseven-maoken-2026-08-18/Google-Fonts/Press-Start-2P"
convert = "ttf"
convert_take = ["font-05.woff2"]
ppem = 8
name = "Press Start 2P"
name_zh = ""
author = ""
homepage = "https://fonts.google.com/specimen/Press+Start+2P"
repository = "https://github.com/google/fonts/tree/main/ofl/pressstart2p"
provenance_url = "https://fonts.google.com/specimen/Press+Start+2P （CSS Unicode-range 切片镜像，v16，latin 子集，收录于 2026-08-18）"
form = "sans"
vibes = ["retro-game"]
# 备注：result.css 共 5 个 @font-face 切片（cyrillic-ext/cyrillic/greek/latin-ext/latin），
# font-05.woff2 对应最后一个"latin"切片（已用 cmap 核实含 'A'）。其余 4 个切片（西里尔/希腊/
# 拉丁扩展）未收录，如需完整字符集需另行合并。detect_native_ppem 对 latin 切片判定失败，
# 但同一字体的 cyrillic-ext/greek 切片（font-01/font-03）判定稳定=8，Press Start 2P 8px
# 网格设计已是公认事实，故手填 ppem=8。

