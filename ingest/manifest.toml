# Family grouping follows README.md's "Font Preview" section and the FOUNDRY/FAMILY_NAME fields in each BDF file's
# STARTPROPERTIES: different bitmap sizes (e.g. 8x8, 8x16, 9x14) from the same source machine
# (BIOS/CGA/CGA Light/EGA/MDA/VGA) are different-resolution variants of the same font and are merged into one family;
