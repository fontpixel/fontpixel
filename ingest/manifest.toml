reason = "hicchicc「00ff」系列当前仍适用 00FF Original License，作者 GitHub 项目表将其标为 Original／proprietary license，2026 年正在逐步迁移至 SIL OFL 但尚未完成。其自定义条款虽允许商用、修改与再分发，但规定修改数据的版权归原作者、条款可不经通知变更，缺少标准许可的不可撤回性、下游授权传递与版本固定机制，因此归类为权限较宽的 proprietary 自定义许可，不能按作者宣布的「未来迁移 OFL」倒推当前文件。待其正式发布 OFL 版本后再收。"

