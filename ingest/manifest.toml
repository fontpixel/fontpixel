source = "pixel-fonts-supplement-zeoseven-maoken-2026-08-18/Maoken-Direct/7577（像素 Silver）"
reason = "作者页面一方面指定 CC BY 4.0，另一方面又要求「制作预算或收入超过 100,000 美元须联系取得许可」。CC BY 4.0 本身允许不限规模的商业使用且合规后不可撤回，两者相互冲突。在作者明确说明该门槛只是自愿联系请求、而非使用条件之前，不纳入严格自由字体集合。"

