[[todo]]
source = "pixel-fonts-supplement-zeoseven-maoken-2026-08-18/Upstream-GitHub/RandomMaerks--Trmnl-Cubic"
reason = "并非真正的点阵/位图字体：README 强调的是'metrically square'（宽高比例接近正方形， 便于 ASCII-art 排版），而非位图网格设计。经坐标抽样检查（如字母 A/B 的轮廓点集）与预览图 （documentation/tc-a1.png）确认，字形是带 45° 斜切的矢量几何造型，边缘平滑非阶梯状；8 个 字重文件（otf+ttf × Bold/Medium/Regular/SemiBold）detect_native_ppem 全部判定失败（None）。 建议不收录，或人工复核后按'other/非像素'方式处理。"
reason_en = "Not really a bitmap font. What the README stresses is that it is metrically square -- a width-to-height ratio close to 1, convenient for ASCII art -- not that it is drawn on a bitmap grid. Sampling the coordinates (the outline point sets of A and B, for instance) and the preview image (documentation/tc-a1.png) confirm vector geometry with 45-degree chamfers and smooth rather than stepped edges, and detect_native_ppem returns None for all eight weight files (otf and ttf across Bold, Medium, Regular, and SemiBold). Recommend leaving it out, or handling it as other/non-pixel after manual review."

