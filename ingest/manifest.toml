# ==================== Merged fragment: manifest-frag-supplement.toml ====================
# Import manifest fragment for pixel-fonts-supplement-zeoseven-maoken-2026-08-18/,
# covering the four subdirectories Upstream-GitHub, Upstream-Direct, Maoken-Direct, Google-Fonts (all fully reviewed),
# plus an orphan-font check for ZeoSeven-Webfonts (this directory was not processed as a whole, only checked for an upstream counterpart).
# Status: fully reviewed. 49 families, 25 todos (8 repo-content merge/exclusion notes + 3 non-bitmap/color
# font exclusions + 14 ZeoSeven-Webfonts orphan fonts). TOML syntax validated with python -c "import tomllib".

# ============ Upstream-GitHub ============

