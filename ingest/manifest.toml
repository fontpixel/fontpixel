# ==================== 合并片段:manifest-frag-pancjk.toml ====================
# 导入清单片段：CJK-bitmap-fonts-open-source-2026-08-18/Pan-CJK/
# 覆盖该目录下全部仓库（已收录跳过：quiple--galmuri、stgiga--UnifontEX；
# 44670 不在本片段范围）。核对方式：ls / find / unzip -l / head，逐仓库确认。
#
# 特别说明：
# 1) ark-pixel：本片段的 [[family]] slug="ark-pixel" 为全尺寸版，
#    将替换 ingest/manifest.toml 中试点的 slug="ark-pixel-12px-monospaced"
#    单尺寸条目，合并时请删除旧条目。
# 2) fusion-pixel / fusion-bold-pixel：这两个仓库的发布 zip 内除根目录
#    OFL.txt 外，还含 LICENSES/<组件字体>/OFL.txt、LICENSES/<组件字体>/
#    LICENSE.txt 等同名子许可证（用于致谢内嵌的 boutique-bitmap-7x7、
#    galmuri、misaki、miseki-bitmap 等组件字体）。由于抽取按 basename
#    落盘，"OFL.txt"/"LICENSE.txt" 这类字面量会与子目录同名文件冲突、
#    互相覆盖，所以这两个家族的 zip_take 只取 "*.bdf"，改用 license_files
#    指向仓库根目录的 LICENSE-OFL / LICENSE-MIT（内容与 zip 内根 OFL.txt
#    一致，经 diff 头部确认），不收录组件字体的许可证副本。
# 3) gnu-unifont：multitheftauto--unifont 仓库的官方发布里，真正的
#    unifont-*.bdf 只存在于 RELEASE-ASSETS/src_unifont-16.0.04.tar.gz
#    内部（且是 .bdf.gz 双重压缩），现有导入器 extract_zip 只支持 .zip、
#    take 不做任何解压，故无法直接取到该 bdf。RELEASE-ASSETS 下另有直接
#    可用的 unifont-16.0.04.otf / unifont_jp-16.0.04.otf（非 zip、非 tar，
#    直接是矢量 OTF），经本地用 pfc.ingest.rasterize.detect_native_ppem
#    实测两者均判定为原生 16 格点，故改用 convert="ttf" 栅格化路线收录，
#    以落实简报里"若有 unifont-*.bdf 就收"的意图（等效替代路径）。

[[family]]
slug = "ark-pixel"
source = "CJK-bitmap-fonts-open-source-2026-08-18/Pan-CJK/TakWolf--ark-pixel-font"
zips = [
    "RELEASE-ASSETS/ark-pixel-font-10px-monospaced-bdf-v2026.08.11.zip",
    "RELEASE-ASSETS/ark-pixel-font-10px-proportional-bdf-v2026.08.11.zip",
    "RELEASE-ASSETS/ark-pixel-font-12px-monospaced-bdf-v2026.08.11.zip",
    "RELEASE-ASSETS/ark-pixel-font-12px-proportional-bdf-v2026.08.11.zip",
    "RELEASE-ASSETS/ark-pixel-font-16px-monospaced-bdf-v2026.08.11.zip",
]
zip_take = ["*.bdf", "OFL.txt"]
name = "Ark Pixel"
name_zh = "方舟像素"
author = "TakWolf"
homepage = "https://ark-pixel-font.takwolf.com"
repository = "https://github.com/TakWolf/ark-pixel-font"
provenance_url = "https://github.com/TakWolf/ark-pixel-font/releases (v2026.08.11)"
form = "gothic"
vibes = ["retro-game"]

[[family]]
slug = "fusion-pixel"
source = "CJK-bitmap-fonts-open-source-2026-08-18/Pan-CJK/TakWolf--fusion-pixel-font"
zips = [
    "RELEASE-ASSETS/fusion-pixel-font-8px-monospaced-bdf-v2026.08.11.zip",
    "RELEASE-ASSETS/fusion-pixel-font-10px-monospaced-bdf-v2026.08.11.zip",
    "RELEASE-ASSETS/fusion-pixel-font-10px-proportional-bdf-v2026.08.11.zip",
    "RELEASE-ASSETS/fusion-pixel-font-12px-monospaced-bdf-v2026.08.11.zip",
    "RELEASE-ASSETS/fusion-pixel-font-12px-proportional-bdf-v2026.08.11.zip",
]
zip_take = ["*.bdf"]                       # 见文件头说明 2)：不取 zip 内 OFL.txt，避免与 LICENSES/ 子目录同名文件冲突
license_files = ["LICENSE-OFL", "LICENSE-MIT"]
name = "Fusion Pixel"
name_zh = "缝合像素"
author = "TakWolf"
homepage = "https://fusion-pixel-font.takwolf.com"
repository = "https://github.com/TakWolf/fusion-pixel-font"
provenance_url = "https://github.com/TakWolf/fusion-pixel-font/releases (v2026.08.11)"
