# ============ TODO ============

[[todo]]
source = "pixel-fonts-supplement-zeoseven-maoken-2026-08-18/Upstream-Direct/Geist-Font-v1.7.2"
reason = "Geist/GeistMono 为纯几何无衬线体/等宽体，与点阵无关（DESCRIPTION.en_us.html 自述『geometric typeface』，非位图字体），按简报要求确认非点阵字体不收录。GeistPixel（含 Circle/Grid/Line/Square/Triangle 五种点形与一个可变字体）虽名带 Pixel、外观点状，但对拉丁字母抽样做轮廓坐标最大公约数检查，结果均为非干净小整数网格（如 Circle/Line/Triangle 变体隐含 ppem≈52.6，Grid≈500，Square≈26.3，皆非典型像素尺寸），detect_native_ppem 对全部变体也判定失败，说明其『像素』只是圆点/方块/三角装饰造型的矢量近似，并非严格网格对齐的位图字体，Doto的早期对比结论已由2026-09-17的独立圆点网格复核更新。建议整包不收录。"
reason_en = "Geist and GeistMono are purely geometric sans and monospace faces with nothing to do with bitmaps -- DESCRIPTION.en_us.html calls Geist a geometric typeface, not a bitmap font -- and the brief says to leave non-bitmap fonts out. GeistPixel (five dot shapes, Circle/Grid/Line/Square/Triangle, plus a variable font) carries Pixel in its name and looks dotted, but a greatest-common-divisor check on the outline coordinates of sampled Latin letters yields no clean small-integer grid for any of them: the Circle, Line, and Triangle variants imply a ppem of about 52.6, Grid about 500, and Square about 26.3, none of them plausible pixel sizes, and detect_native_ppem fails on every variant. Its pixels are a vector approximation of dot, square, and triangle ornament rather than a grid-aligned bitmap -- the earlier Doto comparison was superseded by its separate 2026-09-17 dot-grid review. Recommend leaving the whole package out."

[[todo]]
source = "pixel-fonts-supplement-zeoseven-maoken-2026-08-18/Upstream-Direct/Sango"
reason = "珊瑚字体是彩色像素马赛克风格字体，但技术实现为 OpenType-SVG 彩色字体与 COLR/CPAL 彩色字体（据 readme_sango.txt），并非传统单色点阵/位图字体；本收藏的 convert=ttf 栅格化管线基于 FreeType FT_LOAD_MONOCHROME 单色渲染，无法正确处理彩色图层，会破坏字体的核心视觉设计（马赛克色块）。目录内 Sango-JA-FALLBACK.ttf 单色回退版 detect_native_ppem 判定同样失败，不能确认是否为真正点阵网格。ZeoSeven-Webfonts 内另有 355(Sango-JA-FALLBACK)/356(Sango-JA-SVG) 的 WOFF2 切片镜像，性质相同不建议使用。建议本字体排除在本收藏之外，或后续为彩色字体设计单独的处理管线。"
reason_en = "Sango is a colour pixel-mosaic face, but it is built as an OpenType-SVG colour font and a COLR/CPAL colour font (per readme_sango.txt) rather than a traditional monochrome bitmap font. This collection's convert = \"ttf\" rasterization path rests on FreeType's FT_LOAD_MONOCHROME rendering, which cannot handle colour layers and would destroy the design's whole point, its coloured mosaic blocks. detect_native_ppem also fails on the monochrome fallback in the same directory, Sango-JA-FALLBACK.ttf, so that cannot be confirmed as a true bitmap grid either. ZeoSeven-Webfonts carries WOFF2 slice mirrors of the same thing at 355 (Sango-JA-FALLBACK) and 356 (Sango-JA-SVG), which are no better. Recommend excluding this font, or building a separate pipeline for colour fonts later."

