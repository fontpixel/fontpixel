#
# Family-split notes:
#  - bitocra/ actually contains 4 distinct designs (all by Aaron Christianson / ninjaaron, under the same OFL-1.1
#    license): 4thD, 5thElement, bitbuntu, bitocra (with 7/11/13px and full-charset variants), split into 4 families.
#  - dylex/ contains 2 distinct designs: the 6x10/7x13/10x20 sizes are the dylex fork of X11 misc-fixed ("Fixed"/"terminal"),
#    while 14x14 is a different font named "crawl" (a different FAMILY_NAME in the FONT XLFD), split into
#    dylex-terminal and dylex-crawl.
#  - mplus/ is merged per the user's instruction into a single family mplus-bitmap (slug specified by the user), covering the fxd/hlv/qub/sys
#    weight/size variants; mplus_cursors.bdf is an X11 cursor font (FONT cursor), not a text font, so it goes into todo.
#  - besides the core Tamzen family, tamzen-font/ also has Powerline (a pure-symbol supplement font) and TamzenForPowerline
#    (a superset of each Tamzen face adding 7 Powerline symbols, U+E0A0-E0A2/U+E0B0-E0B3). TamzenForPowerline is merged
#    into the corresponding tamzen variants per the user's instruction (2026-08-31); Powerline's glyphs are thereby covered.
#  - spleen is already included (slug spleen, from fcambus's official repo); this fragment only records one todo entry for it.
#
# License-file review: of the 23 directories, only clearlyu/README embeds the full license text (MIT/X11 style); all other directories
# have no standalone LICENSE/COPYING file. The licensing basis comes from the BDF/PCF header's COPYRIGHT/COMMENT/NOTICE fields, or from the user's
# prior review of the upstream repo (each family block has a comment above it explaining the source of the determination).
#
# 26 families and 4 todos total.

