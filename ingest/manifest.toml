provenance_url = "https://github.com/scott0107000/Uranus-Pixel (HEAD 快照，收录于 2026-08-18)"
forms = ["song", "serif"]
vibes = ["serif", "book"]
# Note: detect_native_ppem returns None (upem=1024 with gcd=1). The em is divided into 14 cells, not a power of two:
# every coordinate is a multiple of 1024/14 = 73.14 rounded to an integer (0, 73, 146, 219, 293 ...), so no single integer
# divisor exists and the detector bails out. ppem=14 is therefore filled in by hand, and at that size the raster matches the
# outline pixel for pixel. The "11Px" in the filename is the ink height, not the em: CJK glyphs are 11 rows tall inside a
# 14px body. ppem=11 was used until 2026-09-03, which scaled the design by 11/14 and mangled every stroke. GPLv2 (inherited from WenQuanYi).

