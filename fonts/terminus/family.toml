note = "知名等宽终端字体，v4.39。含12/14/16/18/20/22/24/28/32px九档尺寸、regular/bold两种字重，14px另有ter-u14v.bdf（framebuffer控制台适配变体），共20个BDF文件。BDF COPYRIGHT字段为 “Copyright (C) 2014 Dimitar Toshkov Zhekov”，NOTICE字段明确 “Licensed under the SIL Open Font License, Version 1.1”。项目主页公开可查（terminus-font.sourceforge.net），但因未见于本仓库README，未填入homepage字段，仅供参考。"
name_en = "SIL Open Font License 1.1"
note_en = "A well-known monospace terminal font, v4.39. It includes nine sizes (12, 14, 16, 18, 20, 22, 24, 28, 32px) and two weights (regular, bold); the 14px size additionally has ter-u14v.bdf (a framebuffer console variant), totaling 20 BDF files. The BDF COPYRIGHT field reads \"Copyright (C) 2014 Dimitar Toshkov Zhekov\", and the NOTICE field states \"Licensed under the SIL Open Font License, Version 1.1\". The project homepage is publicly listed (terminus-font.sourceforge.net) but was not found in this repository's README, so it was not entered in the homepage field; noted here for reference only."
