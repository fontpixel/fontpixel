description_en = "A 12px pan-Unicode pixel font merged from Fairfax, ZLabs Bitmap and Galmuri, formerly code-named FZG. The upstream regular (CN) and Hax builds share the same base glyphs; Hax adds 80 programming-symbol ligature rules. For technical reasons, this site includes only the regular version."
provenance_en = "Upstream https://diaowinner.itch.io/poxiaopixel . The page describes it as \"a font collection based on Fairfax, ZLabs Bitmap, and Galmuri\", with the compilation script forked from ZLabs Bitmap; all three are OFL-1.1 in this catalogue. Private-use areas were remapped: the U+E000 PUA of ZLabs and Galmuri moved to U+10E000, and Powerline symbols returned to their original positions. Rasterised from TTF at its native 12px grid. The bitmap conversion and regenerated downloads do not retain the upstream OpenType substitution rules; use the original upstream files for Hax ligatures and language-specific forms."

