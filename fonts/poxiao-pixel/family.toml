provenance = "上游https://diaowinner.itch.io/poxiaopixel；页面自述“基于Fairfax、ZLabs Bitmap和Galmuri的字体集合，编译脚本fork自ZLabs Bitmap”，三者在本站均为OFL-1.1（见fairfax、zlabs-* 、galmuri）。PUA区块经过重排：ZLabs与Galmuri原U+E000起的私用区移至U+10E000起，Powerline符号归回原位。由ttf按原生12px格点栅格化。位图转换及本站重新生成的下载文件不保留上游OpenType字形替换规则；需要Hax连字或语言专属字形时，请使用上游原始文件。"
