provenance_en = "Upstream https://diaowinner.itch.io/poxiaopixel . The page describes it as \"a font collection based on Fairfax, ZLabs Bitmap, and Galmuri\", with the compilation script forked from ZLabs Bitmap; all three are OFL-1.1 in this catalogue. Private-use areas were remapped: the U+E000 PUA of ZLabs and Galmuri moved to U+10E000, and Powerline symbols returned to their original positions. Rasterised from TTF at its native 12px grid."

