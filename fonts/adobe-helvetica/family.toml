name_en = "Adobe Helvetica"
authors_en = ["Adobe Systems", "Digital Equipment Corporation"]
description_en = "Adobe's Helvetica bitmap faces for X11, shipped with the X Window System between 1984 and 1994 and a fixture of Unix desktops for decades. Four styles - roman, bold, oblique and bold oblique - across the 75dpi and 100dpi sets for twelve pixel sizes in total (8-34px), each face carrying 756 glyphs in ISO 10646."
provenance_en = "Imported from github-clones-2026-08-31; upstream https://gitlab.freedesktop.org/xorg/font/adobe-100dpi"

