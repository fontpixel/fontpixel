name_en = "K14"
authors_en = ["橘浩志", "今村俊幸", "The Electronic Font Open Laboratory"]
description_en = "Hiroshi Tachibana's 14px Japanese bitmap font, finished in 1987 and also known as the Tachibana font; it won the Pioneer Award at the 4th Free Software Awards in 1995 and was one of the defining Japanese faces of the X11 era. Four cuts are catalogued here: regular and bold, plus Toshiyuki Imamura's derivative covering JIS X 0213:2004. The halfwidth characters come from Shinonome Gothic 16."
provenance_en = "Imported from http://jikasei.me/font/jf-dotfont/ (jfdotfont-20150527); converted from ttf"

