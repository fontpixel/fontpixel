description = "橘浩志1987年完成的14px日文点阵字体，又称橘フォント，1995年获第4回自由软件大奖先锋奖，是X11时代日文环境的代表性字模。本站收录常规与粗体，以及今村俊幸所作JIS X 0213：2004对应的派生版，共四款。半角部分取自東雲ゴシック16。"
