name_en = "Handjet"
authors_en = ["David Březina", "Rosetta", "Johannes Neumeier", "Borna Izadpanah", "Khajag Apelian", "Meir Sadan"]
description_en = "A modular pixel typeface by David Březina, Rosetta, and script contributors, covering Latin, Greek, Cyrillic, Armenian, Hebrew, and Arabic. The Regular square-element design is restored at 34px to preserve half-cell positions; each square occupies 2×2 pixels. BDF retains unencoded contextual glyphs but does not include OpenType joining rules."
