provenance = "两档字面原为上游两个仓库，本站合并为一个家族：7×7取自https://github.com/scott0107000/BoutiqueBitmap7x7，9×9（含HK港标字形）取自https://github.com/scott0107000/BoutiqueBitmap9x9，均为HEAD快照、收录于2026-08-18，由ttf转换。9×9与9×9HK的加粗版同取自后一仓库根目录，2026-09-03补收；该仓库另有Bold_Add_Spacing/目录，存放字间加宽一格的同名加粗版，内部字体名与无字间版相同、安装时会互相覆盖，故未收。"
