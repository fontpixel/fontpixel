name_en = "Boutique Bitmap"
authors_en = ["Luke036 (scott0107000)"]
description_en = "A Traditional Chinese bitmap font in two sizes, 7x7 and 9x9; the 9x9 size also ships a build adjusted to Hong Kong standard glyph forms (HK), and both 9x9 builds come with a bold weight. Upstream ships no bold for 7x7."
provenance_en = "The two sizes live in separate upstream repositories and are merged into one family here: 7x7 from https://github.com/scott0107000/BoutiqueBitmap7x7 and 9x9 (including the HK Hong Kong glyph forms) from https://github.com/scott0107000/BoutiqueBitmap9x9 , both HEAD snapshots catalogued 2026-08-18, converted from ttf. The bold weights for 9x9 and 9x9HK come from the root of that same repository, added 2026-09-03; the repository also has a Bold_Add_Spacing/ directory holding bold builds with one extra column of letter spacing, which carry the same internal font names as the no-spacing builds and overwrite them on install, so they are not included."
