provenance_en = "Upstream https://github.com/Warren2060/ChillBitmap , taken from ChillBitmap7x_v2.500.zip in the repository (catalogued 2026-08-30). Rasterised from TTF at its native 8px grid. The README also describes a 16px face based on Unifont, but that repository does not ship its font file, so only the 7px face is catalogued here."

