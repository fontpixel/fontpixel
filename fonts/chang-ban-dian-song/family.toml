name_en = "ChangBanDianSong"
authors_en = ["yzdnn"]
description_en = "A bitmap Song typeface by yzdnn, extending the KH Dot Dogenzaka series by Keitaro Hiraki / Jikasei Font Kobo with simplified and traditional Chinese characters. The 12px size comes in a regular and an anti-blur cut (the SP suffix, which leaves an extra pixel of sidebearing to the right of each character); the 16px size comes in simplified (SC) and traditional (TC) glyph sets. Upstream publishes the two sizes from two separate repositories; they are catalogued here as one family."
provenance_en = "Imported from CJK-bitmap-fonts-open-source-2026-08-18/Chinese; upstream https://github.com/yzdnn/ChangBanDianSong-12/releases (v1.4.3), https://github.com/yzdnn/ChangBanDianSong-16/releases (v1.3.1)"

