note = "12px半窄体（SemiCondensed）等宽终端字体，含bold/book/italic/medium四种字型，另有profont.bdf（FONT XLFD内FAMILY_NAME为 “profont”，但尺寸、SemiCondensed特征与COPYRIGHT文本均与orp系列完全一致，判定为同一设计下的附加变体而非独立的Tobias Jung ProFont），共5个BDF文件（取BDF，同名 .pcf.gz未取用）。各文件COPYRIGHT字段为 “Public domain terminal emulator font. Share and enjoy.”（源自Markus Kuhn的ucs-fonts工程用语）。"
name_en = "Public Domain"
note_en = "A 12px SemiCondensed monospace terminal font with bold/book/italic/medium styles, plus profont.bdf (its XLFD FAMILY_NAME reads \"profont,\" but the size, SemiCondensed characteristics, and COPYRIGHT text match the orp series exactly, so it is treated as an additional variant within the same design rather than the separate Tobias Jung ProFont), for 5 BDF files in total (BDF files used; the matching .pcf.gz files were not taken). Each file's COPYRIGHT field reads \"Public domain terminal emulator font. Share and enjoy.\" (wording originating from Markus Kuhn's ucs-fonts project)."
