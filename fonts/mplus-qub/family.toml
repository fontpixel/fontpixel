name = "M+ 字体自定义许可（宽松，允许商用/复制/分发/修改）"
note = "与我们已收录的pixel-mplus（itouhiro基于M+ 的再设计）不同，本家族是M+ BITMAP FONTS原版，含fxd（等宽Fixed）、hlv（比例宽度Helvetica风格）、sys（比例宽度System风格）、qub（6px极小号Qube）四种子样式，共11个BDF文件。BDF COMMENT明确 “This font is a free software. Unlimited permission is granted to use, copy, and distribute it, with or without modification, either commercially and noncommercially.”。README未署名作者（“M+ fonts by unknown”），故author留空。目录内另有mplus_cursors.bdf（FONT cursor，X11光标字体，非文本字形），未收录，见todo。"
name_en = "M+ Font License (permissive; commercial use, copying, distribution, and modification permitted)"
note_en = "Unlike pixel-mplus (itouhiro's redesign based on M+) already in the collection, this family is the original M+ BITMAP FONTS release, comprising four substyles, fxd (monospace Fixed), hlv (proportional Helvetica-style), sys (proportional System-style), and qub (6px extra-small Qube), for 11 BDF files in total. The BDF COMMENT explicitly states: \"This font is a free software. Unlimited permission is granted to use, copy, and distribute it, with or without modification, either commercially and noncommercially.\" The README credits no author (\"M+ fonts by unknown\"), so the author field is left blank. The directory also contains mplus_cursors.bdf (FONT cursor, an X11 cursor font rather than text glyphs), which was not included; see todo."
