provenance_en = "Reimported the complete official Google Fonts TTF from https://github.com/google/fonts/tree/9a6cc6b8ce992aff77b69c857c46af0b42cdff76/ofl/dotgothic16 (retrieved 2026-09-18). Rasterized unhinted at its native 16px with a +45/64px translation on both axes to align the pixel grid and correct thickened or joined kana strokes. All Unicode mappings and unencoded glyphs are retained; per-character bitmap conversion does not retain OpenType shaping rules."
