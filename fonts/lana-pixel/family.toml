description_en = "An 11px bitmap font made for localising pixel-art games, with roughly 19,500 characters: full Latin, Greek, Cyrillic and Hangul, good Japanese and Simplified Chinese coverage, and decent Traditional Chinese. CJK characters are 9x9; Latin has a 7px cap height."
provenance_en = "Upstream package by eishiya (https://mastodon.art/@eishiya ). This entry uses LanaPixel.ttf from lanapixel_everything, the complete build including Hangul (2023-02-22), rasterised from TTF at 11px — upstream states the font is designed to be displayed at 11px and multiples thereof. The release also ships NoKorean (Hangul removed) and BitmapOnly (embedded bitmaps only, no outlines) builds with identical glyphs; those are not catalogued separately."

