name_en = "Xiaoya Pixel"
authors_en = ["hicc", "DWNfonts (diaowinner)"]
description_en = "A 12px rounded pixel font, reworked from Hicc's Marumeenya for Simplified Chinese typesetting. Upstream describes it as a prototype with limited Simplified Chinese coverage so far."
provenance_en = "Upstream https://github.com/DWNfonts/XiaoyaPixel-Classic ; based on x12y12pxMaruMinya (also catalogued here as x12y12px-maru-minya), with most glyphs auto-generated by the author's Project Rawya. The upstream page notes this is a prototype with few Simplified Chinese characters, some of which are stood in for by Traditional forms. Rasterised from TTF at its native 12px grid."

