description = "12px圆体像素字体，基于患者長ひっく的マルミーニャ二次修改，更适合简体中文排版。上游标注为原型版本，简体汉字数量尚少。"
form = "round"
vibes = ["cute"]
aliases = ["XiaoyaPixel-Classic", "小雅像素字体"]
converted_from = ""
provenance = "上游https://github.com/DWNfonts/XiaoyaPixel-Classic；基于https://github.com/hicchicc/x12y12pxMaruMinya（本站亦收录，见x12y12px-maru-minya），大部分字形由作者的“生雅”项目自动生成。上游页面注明：此版本为原型版本，简体汉字会很少，部分缺字以繁体字代替。由ttf按原生12px格点栅格化。"
