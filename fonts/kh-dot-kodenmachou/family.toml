note_en = "The upstream archive bundles the full SIL_Open_Font_License_1.1.txt, and the README states that the font files may be used under the SIL Open Font License 1.1 and are therefore free of particular restrictions including for commercial use. Copyright in the glyph designs rests with Keitaro Hiraki; the TrueType conversion was done by Jikasei Font Kobo. The series began life as the Dennou Font range for the Sharp X68000 and was once sold under a paid commercial licence; on being converted to TrueType, Hiraki agreed to release it freely under OFL 1.1."
