note = "11px终端字体，含Tewi（常规设计）与Tewi2a（数字2、字母a等字形的替代风格变体）两个子款，各含normal/bold字重，共4个BDF文件。BDF COMMENT内嵌完整GPLv3许可文本（“either version 3 of the License, or (at your option) any later version”），并附带字体嵌入例外条款（内嵌本字体不会导致文档整体受GPL约束）。"
name_en = "GNU General Public License v3.0 or later"
note_en = "An 11px terminal font with two substyles, Tewi (the regular design) and Tewi2a (an alternate-style variant for glyphs such as the digit 2 and the letter a), each with normal/bold weights, for 4 BDF files in total. The BDF COMMENT embeds the full GPLv3 license text (\"either version 3 of the License, or (at your option) any later version\") along with a font-embedding exception clause (embedding this font does not place the whole document under the GPL)."
