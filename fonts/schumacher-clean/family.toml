name_en = "Schumacher Clean"
authors_en = ["Dale Schumacher"]
description_en = "The other classic monospace bitmap family bundled with X11, made by Dale Schumacher in 1989. Thirty-one faces from 4x6 to 9x15 in regular, bold and italic. The 6x12 regular face has been extended to ISO 10646 (1,194 glyphs); the rest carry the 128 glyphs of ISO 646 IRV."
provenance_en = "Imported from github-clones-2026-08-31/xorg-font-schumacher-misc; upstream https://gitlab.freedesktop.org/xorg/font/schumacher-misc"

