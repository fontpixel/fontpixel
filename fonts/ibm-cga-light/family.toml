note = "仓库LICENSE声明全部BDF字体采用CC BY-SA 4.0；本家族复刻自IBM CGA显卡ROM内置字库中笔画较细的“Light”变体（BDF内WEIGHT_NAME标注为Light，是与IBM CGA家族同源但字重不同的独立字体，故单列为一个家族），由VileR在《The Ultimate Oldschool PC Font Pack》中完成像素级复原，farsil（Marco Buzzanca）于2016年转换为BDF格式并整理发布（各BDF文件内COPYRIGHT字段注明：“BDF conversion (c) 2016 farsil, license: CC BY-SA 4.0”）。再分发须保留署名与许可链接，衍生版须继续采用兼容的共享协议。"
