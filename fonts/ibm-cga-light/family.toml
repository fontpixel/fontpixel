name_en = "CC BY-SA 4.0"
note_en = "The repository's LICENSE states that all BDF fonts are licensed under CC BY-SA 4.0. This family reproduces the thinner-stroke \"Light\" variant built into the IBM CGA video card's ROM font (the BDF's WEIGHT_NAME is set to Light; it shares its origin with the IBM CGA family but is a distinct weight, so it is listed as its own family). VileR performed the pixel-level restoration for The Ultimate Oldschool PC Font Pack, and farsil (Marco Buzzanca) converted it to BDF format and published it in 2016 (each BDF file's COPYRIGHT field states \"BDF conversion (c) 2016 farsil, license: CC BY-SA 4.0\"). Redistribution must retain attribution and a license link, and derivative works must continue to use a compatible share-alike license."
