name_en = "ISAS FangSong"
authors_en = ["Institute of Software, Academia Sinica"]
description_en = "A GB2312 FangSong bitmap font made in 1988 by the Institute of Software, Academia Sinica (Chinese Academy of Sciences), in a single 16px size, covering every hanzi and symbol in GB2312; a companion to ISAS Song. The institute released it under a permissive license in the X11/HPND/MIT family, and it is included in many Linux distributions."
provenance_en = "Official X.Org release font-isas-misc-1.0.4.tar.xz (https://xorg.freedesktop.org/archive/individual/font/font-isas-misc-1.0.4.tar.xz, released February 2023, retrieved 2026-09-26, SHA-256 47e595bbe6da444b9f6fcaa26539abc7ba1989e23afa6cdc49e22e484cc438fc); gb16fs.bdf is taken unchanged. The Song fonts from the same package, gb16st.bdf and gb24st.bdf, are catalogued as ISAS Song (isas-song). The BDF is in GB2312.1980 GL encoding and is converted to Unicode at build time. Made in 1988 by the Institute of Software, Academia Sinica."

