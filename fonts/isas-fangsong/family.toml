provenance = "X.Org官方发行版font-isas-misc-1.0.4.tar.xz（https://xorg.freedesktop.org/archive/individual/font/font-isas-misc-1.0.4.tar.xz，2023年2月发布，取于2026-09-26，SHA-256 47e595bbe6da444b9f6fcaa26539abc7ba1989e23afa6cdc49e22e484cc438fc），取其中gb16fs.bdf，原样收录；同包的宋体gb16st.bdf与gb24st.bdf收为中科院宋体点阵（isas-song）。BDF为GB2312.1980 GL编码，构建时转为Unicode。1988年由中国科学院软件研究所（Institute of Software, Academia Sinica）制作。"
