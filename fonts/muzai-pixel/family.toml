description_en = "An 8x12 Chinese/Japanese bitmap font based on Num Kadoma's k8x12, extending it with Simplified Chinese. Formerly named k8x12j."
provenance_en = "Upstream https://github.com/DWNfonts/MuzaiPixel ; glyphs are based on k8x12 (https://littlelimit.net/k8x12.htm ). The release ships MZPXorig.ttf, tuned for square pixels, and MZPXflat.ttf, a full-width workaround for tools that cannot handle the former; upstream notes the two share metadata and cannot both be installed. Only the orig build is catalogued here. Rasterised from TTF at its native 12px grid."

