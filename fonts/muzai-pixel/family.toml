description_en = "An 8x12 Chinese/Japanese bitmap font based on Num Kadoma's k8x12, extending it with Simplified Chinese. Formerly named k8x12j."
provenance_en = "Imported from the native MuzaiPixel.kbitx at https://github.com/DWNfonts/MuzaiPixel (source version 2.0.20241013), based on k8x12 (https://littlelimit.net/k8x12.htm). After correcting kbitx long-run decoding, all 15,932 characters match the corresponding official MZPXorig.ttf in pixels and advance widths. The native bitmap source is retained; the duplicate TTF rasterization is removed."

