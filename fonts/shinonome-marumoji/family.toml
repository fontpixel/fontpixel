converted_from = ""
provenance = "由上游 .bit源码重建：code4fukui/shinonome-font（clone于2026-08-29），用上游自带的公有领域工具tools/bit2bdf与tools/bdfmerge还原各字符集BDF，再按latin1（ISO 8859-1全部）＋hankaku（仅U+FF61–FF9F半角片假名）＋kanji（JIS X 0208全部）合并为单个Unicode BDF，重建代码见pipeline/pfc/ingest/shinonome.py；原始设计 古川泰之 ほか，完整名单见上游AUTHORS。"
