sample_lang = "ja"

name_en = "Shinonome Marumoji"
authors_en = ["The Electronic Font Open Laboratory (efont)", "Yasuyuki Furukawa"]
description_en = "Rounded (marumoji) variant of the Shinonome typeface family; upstream provides only a 12px size."
provenance_en = "Rebuilt from the upstream .bit source: code4fukui/shinonome-font (cloned 2026-08-29). Used the upstream's own public-domain tools tools/bit2bdf and tools/bdfmerge to reconstruct each charset's BDF, then merged latin1 (full ISO 8859-1), hankaku (halfwidth katakana, U+FF61-FF9F only), and kanji (full JIS X 0208) into a single Unicode BDF. Rebuild code at pipeline/pfc/ingest/shinonome.py; Original design by Yasuyuki Furukawa and others; see the upstream AUTHORS file for the full list."

