name = "Shinonome Gothic"
name_zh_hans = "东云黑体"
name_zh_hant = "東雲黑體"
name_ja = "東雲ゴシック"
authors = ["The Electronic Font Open Laboratory (efont)", "古川泰之"]
homepage = "http://openlab.ring.gr.jp/efont/shinonome/"
repository = "https://github.com/code4fukui/shinonome-font"
description = "東雲字体的黑体（ゴシック）版，12／14／16px含汉字与假名，18px仅含半角与拉丁（上游无18px汉字基底）。"
form = "gothic"
vibes = ["classic"]
aliases = ["東雲フォント"]
converted_from = ""
provenance = "由上游 .bit源码重建：code4fukui/shinonome-font（clone于2026-08-29），用上游自带的公有领域工具tools/bit2bdf与tools/bdfmerge还原各字符集BDF，再按latin1（ISO 8859-1全部）＋hankaku（仅U+FF61–FF9F半角片假名）＋kanji（JIS X 0208全部）合并为单个Unicode BDF，重建代码见pipeline/pfc/ingest/shinonome.py；原始设计 古川泰之 ほか，完整名单见上游AUTHORS。"
added = "2026-08-29"
sample_lang = "ja"

name_en = "Shinonome Gothic"
authors_en = ["The Electronic Font Open Laboratory (efont)", "Yasuyuki Furukawa"]
description_en = "The Gothic (sans-serif) style of the Shinonome typeface. The 12, 14, and 16px sizes include kanji and kana; the 18px size includes only half-width and Latin glyphs, since the upstream project has no 18px kanji base."
provenance_en = "Rebuilt from the upstream .bit source: code4fukui/shinonome-font (cloned 2026-08-29). The public-domain tools bundled upstream, tools/bit2bdf and tools/bdfmerge, were used to reconstruct the per-charset BDF files, which were then merged into a single Unicode BDF covering latin1 (all of ISO 8859-1), hankaku (half-width katakana, U+FF61-FF9F only), and kanji (all of JIS X 0208); the rebuild code is at pipeline/pfc/ingest/shinonome.py; Original design by Yasuyuki Furukawa and others; see the upstream AUTHORS file for the full list."

