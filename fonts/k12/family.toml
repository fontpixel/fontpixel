description_en = "Hiroshi Tachibana's 12px Japanese bitmap font in regular and bold, covering the whole of JIS X 0213:2000; the halfwidth characters come from Shinonome Gothic 16. It is the 12px cut of the same design as the 14px K14, but upstream gives the two no common series name, so each is catalogued as its own family."
