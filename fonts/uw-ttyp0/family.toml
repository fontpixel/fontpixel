name = "UW ttyp0"
authors = ["Uwe Waldmann"]
homepage = "https://people.mpi-inf.mpg.de/~uwe/misc/uw-ttyp0/"
repository = ""
description = "覆盖极广的等宽点阵终端字体，含拉丁、希腊、西里尔、越南语、亚美尼亚语、格鲁吉亚语与制表符，11–22px多档尺寸并含粗体与斜体。"
form = "terminal"
vibes = ["terminal-hardcore"]
converted_from = ""
provenance = "官方发行版uw-ttyp0-1.3.tar.gz（https://people.mpi-inf.mpg.de/~uwe/misc/uw-ttyp0/，取于2026-08-29）。上游以字体自有编码的主控BDF分发，本站用其mgl/unicode.mgl按字形名重映射为Unicode BDF，重建代码见pipeline/opf/ingest/uwttyp0.py。masaeedu/bitmap-fonts的1.2快照因缺mgl目录无法重建，未采用。"
added = "2026-08-29"

name_en = "UW ttyp0"
authors_en = ["Uwe Waldmann"]
description_en = "An extremely broad-coverage monospace bitmap terminal font covering Latin, Greek, Cyrillic, Vietnamese, Armenian, Georgian, and box-drawing characters, in multiple sizes from 11 to 22px with bold and italic styles."
provenance_en = "Official release uw-ttyp0-1.3.tar.gz (https://people.mpi-inf.mpg.de/~uwe/misc/uw-ttyp0/, retrieved 2026-08-29). Upstream distributes a master BDF in the font's own custom encoding; this site remaps it to a Unicode BDF using its mgl/unicode.mgl glyph-name mapping. Rebuild code at pipeline/opf/ingest/uwttyp0.py. The 1.2 snapshot in masaeedu/bitmap-fonts lacks the mgl directory and could not be rebuilt, so it was not used."

# Upstream's odd-size files (11/13/15/17px, 10 total) have only 234 glyphs each -- a
# fixed supplementary set of rarely-used precomposed accented letters, arrows, and math symbols, identical across all four sizes,
# and all already present in the corresponding even-size complete fonts. Without basic letters, no text can be typeset at all,
# so including them would just show up as “an 11px font with not a single letter” -- not included.
exclude = ["t0-11*.bdf", "t0-13*.bdf", "t0-15*.bdf", "t0-17*.bdf"]

