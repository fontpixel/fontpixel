provenance = "由上游 .bit 源码重建：code4fukui/shinonome-font（clone 于 2026-08-29），用上游自带的公有领域工具 tools/bit2bdf 与 tools/bdfmerge 还原各字符集 BDF，再按 latin1（ISO 8859-1 全部）＋ hankaku（仅 U+FF61–FF9F 半角片假名）＋ kanji（JIS X 0208 全部）合并为单个 Unicode BDF，重建代码见 pipeline/pfc/ingest/shinonome.py"
added = "2026-08-29"
