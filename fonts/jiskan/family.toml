provenance = "导入自 http://jikasei.me/font/jf-dotfont/ (jfdotfont-20150527)；由 ttf 转换。上游把16px与24px作为两组发布，本站合并为一个家族：同为日本工业标准的同一套字模在两档字身上的实现，由同一机构公开。归属依各字体name表核定：16px全角为電子情報技術産業協会／小山壽久／安岡孝一／今村俊幸／花高信哉，24px全角为電子情報技術産業協会／小山壽久／矢木達也。注：jiskan16s三个文件的设计者字段把全角误标为jiskan24，标注正确的是同包内半角取SONY版的JF-Dot-jiskan16.ttf。"
