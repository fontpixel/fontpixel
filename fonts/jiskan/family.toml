description = "日本工业标准附带的点阵汉字字模，由电子情报技术产业协会公开。本站收录16px与24px两档共五款：16px为JIS X 0208：1990、JIS X 0213：2000、JIS X 0213：2004三个编码档，半角取自東雲ゴシック16（公有领域）；24px为JIS X 0213：2000与2004两档，半角取自平木敬太郎的日比谷24（SIL开放字体许可证1.1）。上游另有半角取自SONY字模的一组，因再分发须附SONY授权文本而该文本未随包提供，本站未收录，其全角部分与此处相同。"
