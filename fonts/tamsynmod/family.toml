note_en = "The release archive contains only eight PCF files, with no licence or readme. Three mutually corroborating pieces of evidence establish the terms: (1) every PCF carries \"GPL\" (no version number) in its COPYRIGHT property; (2) the same author's other font packages (ohsnap, termsyn, terminusmod, stlarch) all state \"Released under GPLv2 license.\" in their READMEs; (3) the base font it modifies, Tamsyn, is licensed with \"Tamsyn font is free. You are hereby granted permission to use, copy, modify, and distribute it as you see fit.\", which itself permits modification and redistribution unconditionally. As no version is stated, it is recorded as GPL-2.0-or-later per the GPL's own convention."
