name_en = "Tom Thumb"
authors_en = ["Robey Pointer", "Brian Swetland"]
description_en = "A 4x6 bitmap font: a 6px face whose glyphs occupy just 3x5 pixels, about as small as Latin letters can get and still be legible. Widely used on LED matrix panels and tiny displays. 204 glyphs."
