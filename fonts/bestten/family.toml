provenance_en = "Imported from direct-downloads-2026-09-03/flopdesign-bestten-1.00; upstream https://flopdesign.booth.pm/items/2747965 (the official Best10-FONT.zip, catalogued 2026-09-03); converted from ttf. Re-sourced 2026-09-03 to the official package, replacing a maoken.com repack: the repack shipped an extra SIL OFL text that made this site read the licence as OFL-1.1, while the official ReadMe and release page both state the font follows the M+ licence; the repack's CRT also covered only 8585 code points against the official build's 10196, a strict subset."

# Both builds are dual-width CJK (10px) with genuinely proportional Latin (i=4, W=6, . =5),
# so neither is monospaced. Left to the heuristic they split: DOT clears the 99% "all advances on
# the W/2W grid" bar by a hair, CRT misses it because 85 more of its glyphs sit at 4px. Declaring
# both keeps the pair together instead of letting a threshold decide.
[variants."BestTen-DOT-10px.bdf"]
spacing = "proportional"

[variants."BestTen-CRT-10px.bdf"]
spacing = "proportional"
