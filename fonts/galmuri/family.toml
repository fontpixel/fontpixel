# Upstream's README marks each variant's recommended display size in the “Summary of Supported Ranges” table
# (https://github.com/quiple/galmuri). This value equals the glyph height + 1 pixel of line spacing, which is not the same as
# the em (ascent + descent) declared in the BDF, so it's listed separately. Upstream doesn't document it for the Mono series.
[variants."Galmuri7.bdf"]
display_size = 8

[variants."Galmuri9.bdf"]
display_size = 10

[variants."Galmuri11.bdf"]
display_size = 12

[variants."Galmuri11-Bold.bdf"]
display_size = 12

[variants."Galmuri11-Condensed.bdf"]
display_size = 12

[variants."Galmuri14.bdf"]
display_size = 15

[variants."GalmuriMono7.bdf"]
display_size = 8

[variants."GalmuriMono9.bdf"]
display_size = 10

[variants."GalmuriMono11.bdf"]
display_size = 12
