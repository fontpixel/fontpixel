note_en = "Both upstream repositories (font-adobe-100dpi and font-adobe-75dpi) carry the same COPYING: an Adobe/DEC HPND-style notice - \"Copyright 1984-1989, 1994 Adobe Systems Incorporated. Copyright 1988, 1994 Digital Equipment Corporation.\" - granting permission \"to use, copy, modify, distribute and sell this software and its documentation for any purpose and without fee\", conditioned on retaining the copyright and permission notices and on not using the Adobe and Digital Equipment names in advertising. Every BDF repeats the same text verbatim in its COMMENT block. Debian's xfonts-100dpi/75dpi and Fedora's xorg-x11-fonts have distributed this set under these terms for three decades. Note: typeface names such as Helvetica, Times and New Century Schoolbook are third-party registered trademarks; their use here is nominative, identifying what the fonts are. This catalogue's inclusion test covers copyright licensing only and implies no endorsement by any trademark owner."
