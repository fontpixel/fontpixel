description_en = "Adobe's Courier bitmap faces for X11, a monospace typewriter design and one of the defaults for terminals and code display in the X11 era. Four styles - roman, bold, oblique and bold oblique - across the 75dpi and 100dpi sets for twelve pixel sizes (8-34px), ISO 10646 encoded."
