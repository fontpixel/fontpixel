<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Bitmap of 开, 7x7 scaled 2x and centred in 16x16 with a 1px margin -->
  <style>
    .paper { fill: #f6f2e9 }
    .ink { fill: #b5312f }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #151310 }
    }
  </style>
  <rect class="paper" width="16" height="16"/>
  <g class="ink">
    <rect x="3" y="1" width="10" height="2"/>
    <rect x="1" y="7" width="14" height="2"/>
    <rect x="5" y="1" width="2" height="10"/>
    <rect x="9" y="1" width="2" height="14"/>
    <rect x="3" y="11" width="2" height="2"/>
    <rect x="1" y="13" width="2" height="2"/>
  </g>
</svg>
