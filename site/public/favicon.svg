<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 9" shape-rendering="crispEdges">
  <!-- 像「开」又像馆门的点阵，7×7 -->
  <style>
    .paper { fill: #f6f2e9 }
    .ink { fill: #b5312f }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #151310 }
    }
  </style>
  <rect class="paper" width="9" height="9"/>
  <g class="ink">
    <rect x="2" y="1" width="5" height="1"/>
    <rect x="3" y="2" width="1" height="2"/>
    <rect x="5" y="2" width="1" height="2"/>
    <rect x="1" y="4" width="7" height="1"/>
    <rect x="3" y="5" width="1" height="3"/>
    <rect x="5" y="5" width="1" height="3"/>
  </g>
</svg>
